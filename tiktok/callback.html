<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>TikTok authorization - copy this</title>
<style>
 body{background:#1A1B2E;color:#F4F1FB;font:16px/1.5 system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 20px}
 h1{color:#C2A8F5;font-size:22px} code{background:#24264A;padding:2px 6px;border-radius:4px;word-break:break-all}
 button{background:#C2A8F5;color:#1A1B2E;border:0;border-radius:8px;padding:12px 18px;font-weight:700;font-size:16px;cursor:pointer}
 .err{color:#ffb4b4} .muted{color:#B9B4D0;font-size:14px}
</style></head>
<body>
<h1>TikTok authorization</h1>
<div id="out">Reading…</div>
<p class="muted">This page is static: it sends nothing anywhere and loads no scripts from other sites. The code expires in minutes and only works with the app secret, but still don't post it in chat. Paste it into the terminal where <code>exchange.py</code> is waiting.</p>
<script>
(function(){
  var full = location.href, p = new URLSearchParams(location.search), o = document.getElementById('out');
  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  if (p.get('error')) { o.innerHTML = '<p class="err">TikTok returned an error: <b>'+esc(p.get('error'))+'</b><br>'+esc(p.get('error_description'))+'</p>'; return; }
  if (!p.get('code')) { o.innerHTML = '<p>No authorization code in this URL. Start again from the link the script printed.</p>'; return; }
  o.innerHTML = '<p>Approved. Granted scopes: <code>'+esc(p.get('scopes'))+'</code></p>'+
    '<p><button id="b">Copy full URL</button> <span id="s" class="muted"></span></p>'+
    '<p class="muted">Then run <code>python3 exchange.py</code> and paste it.</p>';
  document.getElementById('b').onclick = function(){
    navigator.clipboard.writeText(full).then(function(){document.getElementById('s').textContent='Copied.'},
      function(){prompt('Copy this URL:', full)});
  };
  // Remove the code from the address bar/history once captured.
  history.replaceState(null, '', location.pathname);
})();
</script>
</body></html>
